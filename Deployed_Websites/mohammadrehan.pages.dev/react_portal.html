        async function initWasmEngine() {
            if (wasmExports) return wasmExports;
            try {
                const binStr = atob(RQL_WASM_BASE64);
                const bytes = new Uint8Array(binStr.length);
                for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                const module = await WebAssembly.instantiate(bytes, {});
                wasmExports = module.instance.exports;

        // ────────────────────────────────────────────────────────────────────
        // 2. 3D THREE.JS QUANTUM LATTICE COMPONENT
        // ────────────────────────────────────────────────────────────────────
        function QuantumLattice3D() {
            const mountRef = useRef(null);

            useEffect(() => {
                const container = mountRef.current;
                if (!container) return;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
                camera.position.z = 24;

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(container.clientWidth, container.clientHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);

                // Geometric Icosahedron (AegisDB Crystalline Lattice)
                const geometry = new THREE.IcosahedronGeometry(11, 2);
                const wireframeGeometry = new THREE.WireframeGeometry(geometry);
                const lineMaterial = new THREE.LineBasicMaterial({
                    color: 0x00f0ff,
                    transparent: true,
                    opacity: 0.35
                });
                const latticeMesh = new THREE.LineSegments(wireframeGeometry, lineMaterial);
                scene.add(latticeMesh);

                // Inner Particle Core (7-Agent Swarm Tribunal)
                const particleCount = 200;
                const particleGeometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                for (let i = 0; i < particleCount * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 16;
                    positions[i + 1] = (Math.random() - 0.5) * 16;
                    positions[i + 2] = (Math.random() - 0.5) * 16;
                }
                particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const particleMaterial = new THREE.PointsMaterial({
                    color: 0xa855f7,
                    size: 0.45,
                    transparent: true,
                    opacity: 0.8
                });
                const particles = new THREE.Points(particleGeometry, particleMaterial);
                scene.add(particles);

                // Subtle Mouse Interaction
                let mouseX = 0, mouseY = 0;
                const onMouseMove = (e) => {
                    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                    mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
                };
                window.addEventListener('mousemove', onMouseMove, { passive: true });

                let animId;
                let clock = new THREE.Clock();

                const animate = () => {
                    animId = requestAnimationFrame(animate);
                    const elapsedTime = clock.getElapsedTime();

                    latticeMesh.rotation.x = elapsedTime * 0.08 + mouseY * 0.2;
                    latticeMesh.rotation.y = elapsedTime * 0.12 + mouseX * 0.2;

                    particles.rotation.y = -elapsedTime * 0.06;
                    particles.rotation.z = elapsedTime * 0.04;

                    renderer.render(scene, camera);
                };
                animate();

                const onResize = () => {
                    if (!container) return;
                    camera.aspect = container.clientWidth / container.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.clientWidth, container.clientHeight);
                };
                window.addEventListener('resize', onResize);

                return () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('resize', onResize);
                    if (container && renderer.domElement) {
                        container.removeChild(renderer.domElement);
                    }
                    renderer.dispose();
                };
            }, []);

            return <div ref={mountRef} className="absolute inset-0 pointer-events-none opacity-40 md:opacity-60 z-0" />;
        }

        function App() {
            const [wasmReady, setWasmReady] = useState(false);
            const [benchmarkResult, setBenchmarkResult] = useState(null);

            useEffect(() => {
                initWasmEngine().then(exp => {
                    if (exp) {
                        setWasmReady(true);
                        console.log("🦀 [RQL WASM ENGINE] Initialized and verified in React state.");
                    }
                });
            }, []);

            const runBenchmark = () => {
                const iterations = 1000000;
                let wasmTime = 0;
                let jsTime = 0;

                // 1. Run WASM if loaded
                if (wasmExports && wasmExports.rql_benchmark_crunch) {
                    const t0 = performance.now();
                    wasmExports.rql_benchmark_crunch(iterations);
                    wasmTime = performance.now() - t0;
                }

                // 2. Run Equivalent Pure JS
                const t1 = performance.now();
                let acc = 1.0000001;
                let x = 0.5;
                for (let i = 0; i < iterations; i++) {
                    x = 3.999 * x * (1.0 - x);
                    acc = acc + (x * 0.000001) + (i * 0.000000001);
                }
                jsTime = performance.now() - t1;

                const resultStr = wasmTime > 0
                    ? `1,000,000 Ops Benchmarked: Rust WASM = ${wasmTime.toFixed(2)}ms | Pure JS = ${jsTime.toFixed(2)}ms (Rust is ${(jsTime / wasmTime).toFixed(1)}x faster)`
                    : `1,000,000 Ops Benchmarked: JS Engine = ${jsTime.toFixed(2)}ms`;

                setBenchmarkResult(resultStr);
            };

            return (
                <div className="min-h-screen flex flex-col bg-slateCanvas text-slate-100">
                    <Navbar wasmReady={wasmReady} onRunBenchmark={runBenchmark} />
