  <script id="rql-runtime-engine">
(function() {
  'use strict';
  // 1. Air-gap offline/online telemetry banner
  function showAirGapToast(isOffline) {
    var beacon = document.getElementById('rql-airgap-beacon');
    if (!beacon) {
      beacon = document.createElement('div');
      beacon.id = 'rql-airgap-beacon';
      beacon.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99999;padding:6px 14px;border-radius:9999px;font-family:ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:0.05em;transition:opacity 0.2s,transform 0.2s;pointer-events:none;';
      document.body.appendChild(beacon);
    }
    if (isOffline) {
      beacon.textContent = '[AIR-GAP ACTIVE: 100% Offline Mode - Local Verifiers Operational]';
      beacon.style.background = '#064e3b';
      beacon.style.color = '#34d399';
      beacon.style.border = '1px solid #10b981';
      beacon.style.opacity = '1';
    } else {
      beacon.textContent = '[ONLINE: Cloudflare Edge Connected]';
      beacon.style.background = '#0f172a';
      beacon.style.color = '#38bdf8';
      beacon.style.border = '1px solid #0ea5e9';
      setTimeout(function() {
        if (beacon) beacon.style.opacity = '0';
      }, 2500);
    }
  }
  window.addEventListener('offline', function() { showAirGapToast(true); });
  window.addEventListener('online', function() { showAirGapToast(false); });

  // 2. Tab Visibility Management
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      if (window.rqlAudioContext && window.rqlAudioContext.state === 'running') {
        window.rqlAudioContext.suspend();
      }
    } else {
      if (window.rqlAudioContext && window.rqlAudioContext.state === 'suspended') {
        window.rqlAudioContext.resume();
      }
    }
  });

  // 3. Back-to-Top Floating Anchor
  var backToTopBtn = document.createElement('button');
  backToTopBtn.id = 'rql-back-to-top';
  backToTopBtn.setAttribute('aria-label', 'Return to top');
  backToTopBtn.textContent = 'Top';
  backToTopBtn.style.cssText = 'position:fixed;bottom:max(20px,env(safe-area-inset-bottom));right:20px;z-index:9000;padding:8px 14px;border-radius:8px;background:#0b111b;border:1px solid #1e293b;color:#94a3b8;font-family:ui-monospace,monospace;font-size:11px;font-weight:600;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 0.2s,border-color 0.2s;';
  backToTopBtn.addEventListener('click', function() {
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
  });
  document.body.appendChild(backToTopBtn);

  window.addEventListener('scroll', function() {
    if (window.scrollY > 600) {
      backToTopBtn.style.opacity = '1';
      backToTopBtn.style.pointerEvents = 'auto';
    } else {
      backToTopBtn.style.opacity = '0';
      backToTopBtn.style.pointerEvents = 'none';
    }
  }, { passive: true });

  // 4. Secure Target Blank Hardening
  var externalLinks = document.querySelectorAll('a[target="_blank"]');
  for (var i = 0; i < externalLinks.length; i++) {
    var rel = externalLinks[i].getAttribute('rel') || '';
    if (!rel.includes('noopener')) rel += (rel ? ' ' : '') + 'noopener';
    if (!rel.includes('noreferrer')) rel += ' noreferrer';
    externalLinks[i].setAttribute('rel', rel);
  }

  // 5. Form Idempotency Locking
  var forms = document.querySelectorAll('form');
  for (var f = 0; f < forms.length; f++) {
    forms[f].addEventListener('submit', function(e) {
      var btn = this.querySelector('button[type="submit"]');
      if (btn && !btn.disabled) {
        btn.disabled = true;
        btn.setAttribute('data-original-text', btn.textContent);
        btn.textContent = '[TRANSMITTING...]';
        setTimeout(function() {
          btn.disabled = false;
          var orig = btn.getAttribute('data-original-text');
          if (orig) btn.textContent = orig;
        }, 3000);
      }
    });
  }

  // 6. Speculative Internal Link Pre-fetching
  document.addEventListener('pointerenter', function(e) {
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if (a && a.href && a.origin === window.location.origin && !a.href.includes('#')) {
      var existing = document.querySelector('link[rel="prefetch"][href="' + a.href + '"]');
      if (!existing) {
        var link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = a.href;
        document.head.appendChild(link);
      }
    }
  }, { passive: true });
})();
