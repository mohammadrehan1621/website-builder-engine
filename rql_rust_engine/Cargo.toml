[package]
name = "rql_rust_engine"
version = "2.0.0"
edition = "2021"
authors = ["Mohammad Rehan <founder@rehanquantlab.com>"]
description = "High-Performance Quantitative Math Kernel, WebAssembly Engine & Blazing Fast Site Optimizer for Rehan Quant Lab"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rql_builder"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
