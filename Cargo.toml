[package]
name = "rql_website_builder"
version = "2.0.0"
edition = "2021"
authors = ["Mohammad Rehan <founder@rehanquantlab.com>"]
description = "Sovereign Pure-Rust Website Builder Engine — The Pentagon Closed Loop (CW & ACW) Edition"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
filetime = "0.2"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
